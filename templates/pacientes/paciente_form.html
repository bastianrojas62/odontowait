{% extends "base.html" %}
{% block content %}
<h2>{{ form.instance.pk|yesno:"Editar paciente,Nuevo paciente" }}</h2>
<form method="post">{% csrf_token %}
  <table>{{ form.as_table }}</table>
  <p>
    <button class="btn" type="submit">Guardar</button>
    <a class="btn sec" href="{% url 'paciente_lista' %}">Volver</a>
  </p>
</form>
{% endblock %}
